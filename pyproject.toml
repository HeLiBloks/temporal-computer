[project]
name = "temporal-computer"
version = "0.1.0"
description = "Toy simulator for temporal outcome registers and causality-aware scheduling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["temporal_computer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
